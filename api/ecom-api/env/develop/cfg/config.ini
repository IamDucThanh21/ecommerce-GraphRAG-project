[sysdefaults]
LOG_COLORED = True

[rfx_base]
DB_DSN = postgresql+asyncpg://ecommerce:123456@localhost:5432/ecommerce

[fluvius.data]
DB_DSN = postgresql+asyncpg://ecommerce:123456@localhost:5432/ecommerce

[ecom_product]
DB_DSN = postgresql+asyncpg://ecommerce:123456@localhost:5432/ecommerce
SCHEMA = ecom_product

[ecom_message]
DB_DSN = postgresql+asyncpg://ecommerce:123456@localhost:5432/ecommerce
SCHEMA = ecom_message

[ecom_discuss]
DB_DSN = postgresql+asyncpg://ecommerce:123456@localhost:5432/ecommerce
SCHEMA = ecom_discuss

[ecom-ai]
