NEO4J_USER = neo4j
NEO4J_PASSWORD = 12345678
GEMINI_API_KEY = gemini_api_key
GEMINI_MODEL = gemini-2.5-flash

[fluvius.fastapi]
AUTH_PROFILE_PROVIDER=JWTAuthProvider
APPLICATION_SECRET_KEY = your_secret_key_here

[fluvius.error]
